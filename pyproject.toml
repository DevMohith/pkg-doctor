[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-doctor"
version = "0.1.0"
description = "Scan local projects for known-vulnerable or malicious dependencies, and get guided help rotating exposed API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Mohith Tummala" }
]
keywords = ["security", "dependencies", "vulnerability", "supply-chain", "secrets", "cli", "osv", "sbom"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = [
  "click>=8.0",
  "requests",
  "pyyaml",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
pkg-doctor = "pkg_doctor.cli:cli"

[project.urls]
Homepage = "https://github.com/DevMohith/pkg-doctor"
Issues   = "https://github.com/DevMohith/pkg-doctor/issues"

[tool.setuptools.packages.find]
include = ["pkg_doctor*"]
